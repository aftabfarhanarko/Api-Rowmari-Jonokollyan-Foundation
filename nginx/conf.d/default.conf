server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Client Request Body Limits (Supports file/receipt uploads)
    client_max_body_size 25M;

    # Include Hardened OWASP Security & Correlation Headers
    include /etc/nginx/snippets/security-headers.conf;

    # --------------------------------------------------------------------------
    # 1. Health & Liveness Probe (Zero Rate Limits, Suppressed Access Logs)
    # --------------------------------------------------------------------------
    location = /api/v1/health {
        access_log off;
        proxy_pass http://rkf_api_cluster;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # --------------------------------------------------------------------------
    # 2. Authentication Endpoints (Brute-Force Protected: 5 req/sec burst 10)
    # --------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://rkf_api_cluster;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # 3. Sensitive Application Submissions (Strict Protection: 10 req/min)
    # --------------------------------------------------------------------------
    location /api/v1/assistance-applications {
        limit_req zone=api_strict burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://rkf_api_cluster;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # --------------------------------------------------------------------------
    # 4. Standard REST API & Public Endpoints (50 req/sec burst 30)
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=api_general burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://rkf_api_cluster;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # --------------------------------------------------------------------------
    # 5. Internal Nginx Metrics for Monitoring (Prometheus/Grafana/Local)
    # --------------------------------------------------------------------------
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }

    # --------------------------------------------------------------------------
    # 6. JSON Structured Error Responses for Gateway Failures
    # --------------------------------------------------------------------------
    error_page 502 503 504 /custom_gateway_error.json;
    location = /custom_gateway_error.json {
        internal;
        default_type application/json;
        return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"Backend cluster instances are temporarily unavailable. Load balancer retrying..."}}';
    }

    error_page 429 /custom_rate_limit.json;
    location = /custom_rate_limit.json {
        internal;
        default_type application/json;
        return 429 '{"success":false,"error":{"code":"TOO_MANY_REQUESTS","message":"Too many requests sent to the server. Please slow down."}}';
    }
}
