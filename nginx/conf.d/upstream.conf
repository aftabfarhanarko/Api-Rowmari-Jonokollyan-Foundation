# ==============================================================================
# Upstream Load Balancing Cluster
# Romonijon Kallyan Foundation REST API
# ==============================================================================
upstream rkf_api_cluster {
    # Load balancing algorithm: least_conn forwards requests to the instance
    # with the lowest number of active client connections.
    least_conn;
    # Share passive health state across Nginx workers and enable runtime DNS updates.
    zone rkf_api_cluster 64k;

    # Docker Compose embedded DNS. Container IPs change on replacement; resolve
    # service names periodically instead of pinning addresses at Nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # Replicated backend instances
    # Passive health tracking: temporarily avoid a backend after repeated
    # connection or response failures, while retaining the other replicas.
    server api-1:4000 resolve max_fails=2 fail_timeout=5s;
    server api-2:4000 resolve max_fails=2 fail_timeout=5s;
    server api-3:4000 resolve max_fails=2 fail_timeout=5s;

    # HTTP/1.1 Persistent connection pool to avoid TCP handshake overhead
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 30s;
}
