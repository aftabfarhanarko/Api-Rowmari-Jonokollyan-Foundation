# ==============================================================================
# Leaky-Bucket Rate Limiting Zones (DDoS & Brute-Force Protection)
# ==============================================================================

# General API endpoints: 50 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;

# Sensitive Authentication endpoints: 5 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

# Strict endpoints (Assistance applications, payment submissions): 10 requests per minute
limit_req_zone $binary_remote_addr zone=api_strict:10m rate=10r/m;

# HTTP response when rate limit is exceeded
limit_req_status 429;
limit_req_log_level warn;
