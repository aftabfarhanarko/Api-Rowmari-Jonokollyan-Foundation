services:
  # ============================================================================
  # Nginx Production-Ready Reverse Proxy & Load Balancer
  # ============================================================================
  nginx:
    image: nginx:1.30.7-alpine3.24
    container_name: rkf_load_balancer
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/ssl/selfsigned.crt:/etc/nginx/ssl/fullchain.pem:ro
      - ./nginx/ssl/selfsigned.key:/etc/nginx/ssl/privkey.pem:ro
      - rkf_nginx_logs:/var/log/nginx
    depends_on:
      api-1:
        condition: service_started
      api-2:
        condition: service_started
      api-3:
        condition: service_started
    networks:
      - rkf_network

  # ============================================================================
  # Replicated NestJS REST API Instances (Load Balanced by Nginx)
  # ============================================================================
  api-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: rkf_api_1
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rkf_network

  api-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: rkf_api_2
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rkf_network

  api-3:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: rkf_api_3
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rkf_network

  # ============================================================================
  # BullMQ Asynchronous Background Worker
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: rkf_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:worker
    networks:
      - rkf_network

  # ============================================================================
  # Redis (Cache, BullMQ Queues & Rate Limiting Storage)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: rkf_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rkf_redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rkf_network

networks:
  rkf_network:
    driver: bridge

volumes:
  rkf_redisdata:
  rkf_nginx_logs:
